run:
  name: smoke_frozen
  seed: 0
  output_dir: results
  device: auto
data:
  dataset: cifar100
  num_tasks: 2
  classes_per_task: 50
  order_seed: 0
  data_root: data
  num_workers: 2
model:
  backbone: frozen_coarse_block2
  feature_dim: 4096
coarse:
  source: oracle
  soft:
    smooth: 0.3
  trained:
    ckpt: checkpoints/coarse_net.pt
    continual: false
conditioning:
  mechanism: gate
  embed_dim: 32
  aux_loss_weight: 0.5
  eval_withhold: false
train:
  epochs_per_task: 1
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: sgd
coarse_train:
  epochs: 60
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
