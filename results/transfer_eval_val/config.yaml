run:
  name: transfer_eval_val
  seed: 0
  output_dir: results
  device: cuda
data:
  dataset: cifar100
  num_tasks: 10
  classes_per_task: 10
  order_seed: 0
  data_root: data
  num_workers: 4
model:
  backbone: resnet18_small
  feature_dim: 512
coarse:
  source: none
  soft:
    smooth: 0.3
  noisy:
    rate: 0.0
    seed: 0
  trained:
    ckpt: checkpoints/coarse_net.pt
    continual: false
    crossfit: 0
conditioning:
  mechanism: concat
  embed_dim: 32
  aux_loss_weight: 0.5
  decay_weight: 1.0
  eval_withhold: false
rotation:
  enabled: false
  lambda_max: 0.5
  schedule: per_task
  tap: layer2
  hidden: 128
cl:
  methods: []
  replay:
    buffer_size: 2000
    batch_size: 32
    weight: 1.0
    priority: none
    priority_schema: oracle
    priority_mix: 0.5
    priority_refresh: 50
    priority_level: exemplar
    priority_probe_per_class: 0
  ewc:
    ewc_lambda: 5000.0
    fisher_batches: 32
train:
  epochs_per_task: 60
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  optimizer: sgd
  loss_scope: seen
coarse_train:
  arch: small
  epochs: 60
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  label_mode: coarse
  shuffle_frac: 0.0
transfer_eval:
  conditions:
  - pre_coarse
  - pre_shuffle25
  - pre_shuffle50
  - pre_shuffle100
  - pre_fine
  - scratch
  ckpt: checkpoints/transfer/{condition}_f{fold}_s{seed}.pt
  folds:
  - 0
  - 1
  - 2
  - 3
  seeds:
  - 0
  - 1
  - 2
  split: val
  val_per_class: 100
  split_seed: 0
  taps:
  - layer2
  - layer3
  - layer4
  ks:
  - 1
  - 5
  - 10
  - 25
  - 50
  - 100
  - 400
  episodes: 20
  cross_sets: 20
  episode_seed: 0
  probe_wd:
  - 0.0001
  - 0.001
  - 0.01
  probe_steps: 300
  probe_lr: 0.05
