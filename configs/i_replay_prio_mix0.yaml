# Code-path control for the priority runs: the priority sampler (i.i.d. draws with
# replacement, re-scoring every 50 steps) with priority_mix 0, i.e. exactly uniform
# weights. Six priority runs averaged 0.284 vs 0.332 for uniform replay, including
# near-uniform ones (ESS 0.97-0.99). If this lands near them, the sampling path is
# the cost, not the priority. Compare vs i_replay_baseline / cal2000 / baseline_hippo.
run: {name: i_replay_prio_mix0}
cl:
  methods: [replay]
  replay: {priority: schema, priority_schema: oracle, priority_mix: 0.0}
