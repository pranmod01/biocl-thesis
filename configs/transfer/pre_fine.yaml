# Transfer experiment pretraining (coarsecl/transfer/folds.py). One net per fold x seed:
#   python -m coarsecl.coarse.train_coarse --config configs/transfer/pre_fine.yaml --split-fold k --seed s
# 45-way fine labels on the same images: the related-data transfer baseline.
run:
  name: pre_fine
data:
  num_workers: 8
coarse:
  trained:
    ckpt: checkpoints/transfer/pre_fine_f{fold}_s{seed}.pt
coarse_train:
  arch: resnet18
  epochs: 150
  label_mode: fine
