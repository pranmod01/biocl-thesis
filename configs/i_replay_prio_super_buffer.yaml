# Per-superclass schema priority, scored on the replay buffer itself (oracle schema).
# Isolates the DIVERSITY fix: i_replay_prio_schema_oracle collapsed onto the few
# unmemorized exemplars (ESS 0.40, avg 0.233). Here a superclass's weight is spread
# over its whole pool. The score still comes from memorized exemplars.
run: {name: i_replay_prio_super_buffer}
cl:
  methods: [replay]
  replay: {priority: schema, priority_schema: oracle, priority_level: superclass}
